<div class="al-root" [class.sidebar-open]="sidebarOpen">

  <!-- ─── Sidebar ───────────────────────────────────────────────────────── -->
  <app-admin-sidebar (closeRequest)="sidebarOpen = false" />

  <!-- ─── Backdrop (mobile) ─────────────────────────────────────────────── -->
  <div class="al-backdrop" (click)="sidebarOpen = false" aria-hidden="true"></div>

  <!-- ─── Main column ───────────────────────────────────────────────────── -->
  <div class="al-main">

    <!-- Top bar -->
    <header class="al-topbar">

      <!-- Hamburger (mobile) -->
      <button
        type="button"
        class="al-hamburger"
        (click)="sidebarOpen = !sidebarOpen"
        aria-label="Toggle sidebar">
        <i class="ph ph-list"></i>
      </button>

      <div class="al-topbar__left">
        <div class="al-topbar__icon" aria-hidden="true">
          <i class="ph-fill ph-shield-check"></i>
        </div>
        <div>
          <h1 class="al-topbar__title">Admin Panel</h1>
          <p class="al-topbar__sub">
            Welcome back, <strong>{{ currentAdminName() }}</strong>
          </p>
        </div>
      </div>

      <div class="al-topbar__right">
        <span class="al-status">
          <span class="al-status__dot"></span>
          All systems operational
        </span>
      </div>

    </header>

    <!-- Page content -->
    <main class="al-content">
      <div class="al-content__inner">
        <router-outlet />
      </div>
    </main>

  </div>

</div>
