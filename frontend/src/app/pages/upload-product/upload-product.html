<div class="upload-root">

  <!-- Background -->
  <div class="upload-bg">
    <div class="upload-bg__orb upload-bg__orb--1"></div>
    <div class="upload-bg__orb upload-bg__orb--2"></div>
    <div class="upload-bg__grid"></div>
  </div>

  <div class="upload-wrap">
    <div class="upload-card">

      <!-- Header -->
      <div class="upload-header">
        <div class="upload-header__icon">🌾</div>
        <h1 class="upload-header__title">Upload New Harvest</h1>
        <p class="upload-header__sub">Add your crop to the blockchain — forever trusted</p>
      </div>

      <form (ngSubmit)="uploadProduct()" class="upload-form">

        <!-- Crop Name -->
        <div class="form-group">
          <label class="form-label" for="cropName">Crop Name</label>
          <input
            id="cropName"
            [(ngModel)]="cropName"
            name="cropName"
            required
            class="form-input"
            placeholder="e.g. Basmati Rice, Red Onion, Organic Tomato">
        </div>

        <!-- Soil & Pesticides -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="soilType">Soil Type</label>
            <input
              id="soilType"
              [(ngModel)]="soilType"
              name="soilType"
              class="form-input"
              placeholder="e.g. Loamy, Red Soil">
          </div>
          <div class="form-group">
            <label class="form-label" for="pesticides">Pesticides Used</label>
            <input
              id="pesticides"
              [(ngModel)]="pesticides"
              name="pesticides"
              class="form-input"
              placeholder="e.g. None, Neem Oil, Organic">
          </div>
        </div>

        <!-- Harvest Date -->
        <div class="form-group">
          <label class="form-label" for="harvestDate">Harvest Date</label>
          <input
            id="harvestDate"
            type="date"
            [(ngModel)]="harvestDate"
            name="harvestDate"
            [max]="today"
            required
            class="form-input form-input--date">
        </div>

        <!-- GPS Location -->
        <div class="form-group">
          <label class="form-label" for="gpsLocation">GPS Location</label>
          <div class="gps-row">
            <input
              id="gpsLocation"
              [(ngModel)]="gpsLocation"
              name="gpsLocation"
              readonly
              class="form-input gps-row__input"
              placeholder="Auto-detected location">
            <button
              type="button"
              (click)="detectGPS()"
              [disabled]="loading"
              class="btn btn--gps"
              id="detect-gps-btn">
              <span>📍</span> Detect GPS
            </button>
          </div>
        </div>

        <!-- Image Upload -->
        <div class="form-group">
          <label class="form-label">Product Image</label>
          <label class="file-drop" for="imageUpload">
            <span class="file-drop__icon">📷</span>
            <span class="file-drop__text">
              {{ imageFile ? imageFile.name : 'Click to upload product image' }}
            </span>
            <span class="file-drop__hint">PNG, JPG, WEBP accepted</span>
            <input
              id="imageUpload"
              type="file"
              (change)="onFileSelected($event)"
              accept="image/*"
              required
              class="file-drop__input">
          </label>

          <!-- Image Preview -->
          <div *ngIf="previewUrl" class="preview-box">
            <img [src]="previewUrl" class="preview-box__img" alt="Product preview">
            <p class="preview-box__label">✅ Image ready — looks amazing!</p>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loading || !imageFile"
          class="btn btn--submit"
          id="upload-submit-btn">
          <span *ngIf="!loading">🚀 Upload &amp; Generate QR Code</span>
          <span *ngIf="loading" class="btn--submit__loading">
            <span class="spinner"></span> Uploading to Blockchain...
          </span>
        </button>

      </form>

      <!-- Card Footer -->
      <div class="upload-card__footer">
        <p>Powered by <strong>FarmChainX</strong> • Transparent • Trusted • Immutable</p>
      </div>

    </div>
  </div>

</div>
