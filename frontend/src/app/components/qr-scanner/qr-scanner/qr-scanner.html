<div class="scan-root">

  <div class="scan-card">

    <h2 class="scan-title">
      <i class="ph-fill ph-qr-code"></i>
      Scan QR Code
    </h2>

    <!-- Tabs -->
    <div class="scan-tabs">
      <button type="button" class="scan-tab" [class.active]="!usingFileUpload" (click)="restart()">
        <i class="ph-fill ph-camera"></i> Camera
      </button>
      <button type="button" class="scan-tab" [class.active]="usingFileUpload" (click)="usingFileUpload = true; isScanning = false">
        <i class="ph-fill ph-upload-simple"></i> Upload Photo
      </button>
    </div>

    <!-- Camera scanner -->
    <div *ngIf="isScanning && !usingFileUpload" class="scan-viewport">
      <zxing-scanner
        [formats]="formats"
        (scanSuccess)="onScanSuccess($event)"
        (scanError)="onScanError($event)"
        (permissionResponse)="onPermission($event)"
        (camerasFound)="onCamerasFound($event)"
        [torch]="torchEnabled"
        class="scan-zxing">
      </zxing-scanner>

      <div class="scan-frame" aria-hidden="true">
        <span class="corner corner--tl"></span>
        <span class="corner corner--tr"></span>
        <span class="corner corner--bl"></span>
        <span class="corner corner--br"></span>
        <span class="sweep"></span>
      </div>

      <button *ngIf="hasTorch" type="button" class="torch-btn" (click)="torchEnabled = !torchEnabled" [class.active]="torchEnabled">
        <i class="ph-fill ph-flashlight"></i>
        {{ torchEnabled ? 'Torch ON' : 'Torch OFF' }}
      </button>
    </div>

    <!-- Upload -->
    <div *ngIf="!isScanning || usingFileUpload" class="upload-area">

      <div *ngIf="!uploadedImageUrl" class="upload-drop">
        <i class="ph-fill ph-image-square"></i>
        <p>Choose a photo of the QR code</p>
        <label class="upload-btn" for="qr-file">
          <i class="ph ph-folder-open"></i> Choose Photo
          <input id="qr-file" type="file" accept="image/*" (change)="onFileSelected($event)" class="sr-only" />
        </label>
      </div>

      <div *ngIf="uploadedImageUrl" class="preview-wrap">
        <img [src]="uploadedImageUrl" alt="Uploaded QR" class="preview-img" />
        <div class="scanning-badge">
          <span class="badge-dot"></span> Scanning…
        </div>
      </div>

    </div>

    <p class="scan-hint">Point at any FarmChainX product QR code to verify it on the blockchain.</p>

  </div>

</div>
